version: '3.8'

services:
  fitcream-server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=http://localhost:5173
    restart: unless-stopped

  fitcream-client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - fitcream-server
    restart: unless-stopped
